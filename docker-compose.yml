services:
  reminder-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-reminder-bot
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
