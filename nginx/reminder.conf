# Nginx reverse proxy configuration for Telegram Reminder Bot & Mini App
# Place in /etc/nginx/sites-available/reminder.kori.rest and symlink to sites-enabled

server {
    server_name reminder.kori.rest;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # SSL configuration will be automatically added by Certbot:
    # sudo certbot --nginx -d reminder.kori.rest
}
